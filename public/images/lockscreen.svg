"use client";

import { useEffect, useMemo, useRef, useState } from "react";
import { apps, appArtwork } from "@/data/apps";
import { contacts } from "@/data/contacts";
import { conversations } from "@/data/conversations";
import { notes } from "@/data/notes";
import { lockscreenNotifications } from "@/data/notifications";
import { imagePaths } from "@/data/image-paths";

type Screen = "lock" | "home" | "messages-list" | "messages-detail" | "notes-list" | "notes-detail" | "notes-lock";

type PopupState = {
  title: string;
  message: string;
} | null;

const formatClock = (date: Date) =>
  date.toLocaleTimeString("ko-KR", {
    hour: "numeric",
    minute: "2-digit",
    hour12: true,
  });

const formatDate = (date: Date) =>
  new Intl.DateTimeFormat("ko-KR", {
    month: "long",
    day: "numeric",
    weekday: "long",
  }).format(date);

export default function IphoneSimulator() {
  const [screen, setScreen] = useState<Screen>("lock");
  const [now, setNow] = useState<Date | null>(null);
  const [selectedContactId, setSelectedContactId] = useState<string>("captain-hollander");
  const [selectedNoteId, setSelectedNoteId] = useState<string>("daily-plan");
  const [searchValue, setSearchValue] = useState("");
  const [popup, setPopup] = useState<PopupState>(null);
  const [notePassword, setNotePassword] = useState("");
  const [notePasswordError, setNotePasswordError] = useState("");
  const [unlockedNotes, setUnlockedNotes] = useState<string[]>([]);
  const chatBodyRef = useRef<HTMLDivElement | null>(null);

  useEffect(() => {
    const tick = () => setNow(new Date());
    tick();
    const interval = window.setInterval(tick, 30000);
    return () => window.clearInterval(interval);
  }, []);

  useEffect(() => {
    if (chatBodyRef.current) {
      chatBodyRef.current.scrollTop = chatBodyRef.current.scrollHeight;
    }
  }, [selectedContactId, screen]);

  const contact = useMemo(
    () => contacts.find((item) => item.id === selectedContactId) ?? contacts[0],
    [selectedContactId],
  );

  const conversation = useMemo(
    () => conversations.find((item) => item.contactId === selectedContactId) ?? conversations[0],
    [selectedContactId],
  );

  const note = useMemo(
    () => notes.find((item) => item.id === selectedNoteId) ?? notes[0],
    [selectedNoteId],
  );

  const filteredContacts = contacts.filter((item) => {
    if (!searchValue.trim()) return true;
    return item.name.toLowerCase().includes(searchValue.toLowerCase());
  });

  const openApp = (appId: string) => {
    if (appId === "messages") {
      setScreen("messages-list");
      return;
    }

    if (appId === "notes") {
      setScreen("notes-list");
      return;
    }

    setPopup({
      title: "이 콘텐츠는 열람할 수 없습니다.",
      message: "해당 앱은 이 가상 시뮬레이터에서 지원하지 않는 화면입니다.",
    });
  };

  const goHome = () => {
    setScreen("home");
    setNotePassword("");
    setNotePasswordError("");
  };

  const unlockPhone = () => {
    setScreen("home");
  };

  const openSelectedNote = (nextNoteId: string) => {
    setSelectedNoteId(nextNoteId);
    const targetNote = notes.find((item) => item.id === nextNoteId);
    if (!targetNote?.locked || unlockedNotes.includes(nextNoteId)) {
      setScreen("notes-detail");
      return;
    }
    setScreen("notes-lock");
    setNotePassword("");
    setNotePasswordError("");
  };

  const verifyNotePassword = () => {
    if (!note.password) {
      setScreen("notes-detail");
      return;
    }

    if (notePassword.trim() === note.password) {
      setUnlockedNotes((prev) => (prev.includes(note.id) ? prev : [...prev, note.id]));
      setScreen("notes-detail");
      setNotePasswordError("");
      return;
    }

    setNotePasswordError("비밀번호가 올바르지 않습니다.");
  };

  const renderLockScreen = () => (
    <div className="iphone-screen">
      <div className="lock-screen" style={{ backgroundImage: `url(${imagePaths.lockscreen})` }}>
        <div className="status-bar">
          <div className="status-left">{now ? now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false }) : "09:41"}</div>
          <div className="status-right">
            <div className="signal" aria-label="signal">
              <span />
              <span />
              <span />
              <span />
            </div>
            <span>5G</span>
            <span className="battery" aria-label="battery" />
          </div>
        </div>

        <div className="lock-screen-content">
          <div>
            <div className="lock-time">{now ? formatClock(now) : "9:41"}</div>
            <div className="lock-date">{now ? formatDate(now) : "월요일, 11월 8일"}</div>
          </div>

          <div className="notification-stack">
            {lockscreenNotifications.map((item, index) => (
              <div key={`${item.app}-${index}`} className="notification-card" style={{ zIndex: 3 - index }}>
                <div className="notification-top">
                  <div className="notification-app">
                    <span className="notification-dot" />
                    <span>{item.app}</span>
                  </div>
                  <span>now</span>
                </div>
                <div className="notification-body">{item.title}</div>
                <div className="notification-meta">{item.meta}</div>
              </div>
            ))}
          </div>

          <div className="lock-tools">
            <div className="tool-badge">🔦</div>
            <div className="tool-badge">📷</div>
          </div>
        </div>
      </div>

      <div className="unlock-row">
        <button className="unlock-pill" onClick={unlockPhone}>잠금 해제</button>
      </div>
    </div>
  );

  const renderHomeScreen = () => (
    <div className="iphone-screen">
      <div className="home-screen" style={{ backgroundImage: `url(${imagePaths.homescreen})` }}>
        <div className="status-bar">
          <div className="status-left">{now ? now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false }) : "09:41"}</div>
          <div className="status-right">
            <div className="signal"><span /><span /><span /><span /></div>
            <span>5G</span>
            <span className="battery" aria-label="battery" />
          </div>
        </div>

        <div className="home-content">
          <div />

          <div className="app-grid">
            {apps.map((app) => (
              <button key={app.id} className="app-tile" onClick={() => openApp(app.id)}>
                <div className="app-icon">
                  {app.image ? <img src={app.image} alt={app.name} /> : <span>{app.icon}</span>}
                </div>
                <div className="app-name">{app.name}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );

  const renderMessagesList = () => (
    <div className="app-window">
      <div className="header-bar">
        <div className="header-left">
          <button className="back-button" onClick={goHome}>‹</button>
        </div>
        <div className="screen-title">메시지</div>
        <div className="header-right">
          <button className="circle-button" aria-label="edit">✎</button>
        </div>
      </div>

      <div className="messages-header">
        <input
          className="search-box"
          value={searchValue}
          onChange={(event) => setSearchValue(event.target.value)}
          placeholder="검색"
          aria-label="메시지 검색"
        />
      </div>

      <div className="conversation-list">
        {filteredContacts.map((item) => {
          const lastMessage = conversations.find((conversationItem) => conversationItem.contactId === item.id)?.messages.at(-1);
          const previewText = item.id === "captain-hollander" ? "작성 중…" : lastMessage?.content ?? item.lastPreview;

          return (
            <button
              key={item.id}
              className="conversation-item"
              onClick={() => {
                setSelectedContactId(item.id);
                setScreen("messages-detail");
              }}
            >
              <div className={`avatar ${item.id === "captain-hollander" ? "blue" : "green"}`}>
                {item.avatarText}
              </div>
              <div className="conversation-meta">
                <div className="contact-name-row">
                  <span className="contact-name">{item.name}</span>
                  <span className="last-time">{lastMessage?.time ?? "지금"}</span>
                </div>
                <div className="preview-row">
                  <span className="preview-text">{previewText}</span>
                  {item.unreadCount ? <span className="unread-badge">{item.unreadCount}</span> : null}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );

  const renderMessagesDetail = () => (
    <div className="chat-screen">
      <div className="chat-bg" style={{ backgroundImage: `url(${imagePaths.chatBackground})` }} />

      <div className="header-bar chat-header">
        <div className="header-left">
          <button className="back-button" onClick={() => setScreen("messages-list")}>‹</button>
        </div>
        <div className="chat-identity">
          <div className="avatar blue">{contact.avatarText}</div>
          <div className="chat-name">{contact.name}</div>
        </div>
        <div className="header-right">
          <button className="circle-button" aria-label="info">ℹ</button>
        </div>
      </div>

      <div className="chat-body" ref={chatBodyRef}>
        {conversation.messages.map((message) => {
          const isMe = message.sender === "me";
          const showRead = isMe && message.read;

          return (
            <div key={message.id} className={`chat-row ${isMe ? "me" : "other"}`}>
              <div className="bubble-stack">
                {!isMe ? <div className="avatar blue" style={{ width: 26, height: 26, fontSize: 0.7 + "rem" }}>{contact.avatarText}</div> : null}
                <div className="chat-bubble">{message.content}</div>
              </div>
              {showRead ? <div className="read-mark">읽음</div> : null}
            </div>
          );
        })}

        <div className="typing-row">
          <div className="typing-avatar">CH</div>
          <div className="typing-bubble" aria-label="입력 중">
            <span className="typing-dot" />
            <span className="typing-dot" />
            <span className="typing-dot" />
          </div>
        </div>
      </div>

      <div className="chat-input-box">
        <input className="chat-input" value="메시지를 보낼 수 없습니다" readOnly />
      </div>
    </div>
  );

  const renderNotesList = () => (
    <div className="notes-screen">
      <div className="header-bar">
        <div className="header-left">
          <button className="back-button" onClick={goHome}>‹</button>
        </div>
        <div className="screen-title">메모</div>
        <div className="header-right">
          <button className="circle-button" aria-label="new note">＋</button>
        </div>
      </div>

      <div className="notes-list">
        {notes.map((item) => (
          <button key={item.id} className="note-item" onClick={() => openSelectedNote(item.id)}>
            <div className="note-top">
              <span className="note-title">{item.title}</span>
              {item.locked ? <span className="note-lock">🔒</span> : null}
            </div>
            <div className="note-preview">{item.preview}</div>
          </button>
        ))}
      </div>
    </div>
  );

  const renderNoteDetail = () => (
    <div className="notes-screen">
      <div className="header-bar">
        <div className="header-left">
          <button className="back-button" onClick={() => setScreen("notes-list")}>‹</button>
        </div>
        <div className="screen-title">메모</div>
        <div className="header-right">
          <button className="circle-button" aria-label="close" onClick={goHome}>×</button>
        </div>
      </div>

      <div className="note-detail" style={{ backgroundImage: `url(${imagePaths.notesBackground})`, backgroundSize: "cover", backgroundPosition: "center" }}>
        <h3>{note.title}</h3>
        <p>{note.locked && !unlockedNotes.includes(note.id) ? "잠금 상태의 메모입니다." : note.content}</p>
      </div>
    </div>
  );

  const renderNoteLock = () => (
    <div className="notes-screen">
      <div className="header-bar">
        <div className="header-left">
          <button className="back-button" onClick={() => setScreen("notes-list")}>‹</button>
        </div>
        <div className="screen-title">잠금 메모</div>
        <div className="header-right">
          <button className="circle-button" aria-label="close" onClick={goHome}>×</button>
        </div>
      </div>

      <div className="password-box">
        <label htmlFor="note-password">이 메모는 잠겨 있습니다.</label>
        <input
          id="note-password"
          type="password"
          value={notePassword}
          onChange={(event) => setNotePassword(event.target.value)}
          placeholder="비밀번호 입력"
        />
        {notePasswordError ? <div className="error-text">{notePasswordError}</div> : null}
        <button onClick={verifyNotePassword}>확인</button>
      </div>
    </div>
  );

  const renderPopup = () => {
    if (!popup) return null;

    return (
      <div className="popup-overlay" onClick={() => setPopup(null)}>
        <div className="popup-card" onClick={(event) => event.stopPropagation()}>
          <div className="popup-content">
            <div className="popup-title">{popup.title}</div>
            <div className="popup-message">{popup.message}</div>
          </div>
          <div className="popup-actions">
            <button onClick={() => setPopup(null)}>확인</button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="app-shell">
      <div className="iphone-frame">
        <div className="iphone-screen" style={{ position: "relative" }}>
          <div className="notch" />
          {screen === "lock" ? renderLockScreen() : null}
          {screen === "home" ? renderHomeScreen() : null}
          {screen === "messages-list" ? renderMessagesList() : null}
          {screen === "messages-detail" ? renderMessagesDetail() : null}
          {screen === "notes-list" ? renderNotesList() : null}
          {screen === "notes-detail" ? renderNoteDetail() : null}
          {screen === "notes-lock" ? renderNoteLock() : null}

          {popup ? renderPopup() : null}
        </div>
      </div>
    </div>
  );
}
